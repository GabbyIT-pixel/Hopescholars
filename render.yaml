# One-click deploy on Render (https://render.com): New + > Blueprint > select this repo.
services:
  - type: web
    name: hope-scholar
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        sync: false          # you will be asked to type this in the Render dashboard
      - key: SEED_DEMO
        value: "true"        # demo student/provider accounts + sample scholarships
      - key: DEMO_MODE
        value: "false"       # keep false on a public site: true would show reset links on screen to anyone
      - key: PUBLIC_URL
        sync: false          # your site address, e.g. https://hope-scholar.onrender.com
      - key: SMTP_HOST
        sync: false          # email for password-reset links, e.g. smtp.gmail.com (optional but recommended)
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false          # Gmail app password; never commit it to GitHub
      - key: MAIL_FROM
        sync: false
      - key: NODE_VERSION
        value: "22"
